        <script>
            // Apply cached admin theme before React mounts to avoid a
            // light-then-dark flash on first paint. The full source of truth
            // is `/api/settings.theme`, which is fetched + reconciled in
            // App.js. See src/lib/theme.js for the full flow.
            (function () {
                try {
                    var t = localStorage.getItem("admin_theme") || "light";
                    if (t === "dark") document.documentElement.classList.add("dark");
                    document.documentElement.dataset.theme = t;
                } catch (e) { /* private-mode: just keep default light theme */ }
            })();
        </script>
